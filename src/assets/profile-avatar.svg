<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <radialGradient id="radarGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#06b6d4" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(16, 185, 129, 0.08)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="400" height="400" fill="url(#bgGrad)" />
  <rect width="400" height="400" fill="url(#grid)" />
  <circle cx="200" cy="200" r="180" fill="url(#radarGlow)" />
  
  <!-- Avionics HUD Rings -->
  <circle cx="200" cy="200" r="160" fill="none" stroke="rgba(16, 185, 129, 0.25)" stroke-width="1.5" stroke-dasharray="4 8" />
  <circle cx="200" cy="200" r="130" fill="none" stroke="rgba(6, 182, 212, 0.3)" stroke-width="1" />
  <circle cx="200" cy="200" r="100" fill="none" stroke="rgba(16, 185, 129, 0.2)" stroke-width="1" stroke-dasharray="12 4" />
  
  <!-- Compass Ticks -->
  <line x1="200" y1="20" x2="200" y2="35" stroke="#10b981" stroke-width="2" />
  <line x1="200" y1="365" x2="200" y2="380" stroke="#10b981" stroke-width="2" />
  <line x1="20" y1="200" x2="35" y2="200" stroke="#10b981" stroke-width="2" />
  <line x1="365" y1="200" x2="380" y2="200" stroke="#10b981" stroke-width="2" />

  <text x="200" y="52" fill="#34d399" font-family="monospace" font-size="11" text-anchor="middle" font-weight="bold">360° N</text>
  <text x="200" y="360" fill="#34d399" font-family="monospace" font-size="11" text-anchor="middle" font-weight="bold">180° S</text>

  <!-- Stylized Drone / VTOL Silhouette -->
  <g transform="translate(200, 150) scale(0.85)">
    <!-- Drone Arms -->
    <line x1="-90" y1="-50" x2="90" y2="50" stroke="#34d399" stroke-width="3" stroke-linecap="round" />
    <line x1="-90" y1="50" x2="90" y2="-50" stroke="#34d399" stroke-width="3" stroke-linecap="round" />
    <!-- Rotors -->
    <ellipse cx="-90" cy="-50" rx="28" ry="8" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="4 2" />
    <ellipse cx="90" cy="50" rx="28" ry="8" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="4 2" />
    <ellipse cx="-90" cy="50" rx="28" ry="8" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="4 2" />
    <ellipse cx="90" cy="-50" rx="28" ry="8" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="4 2" />
    <!-- Center Avionics Core -->
    <rect x="-35" y="-25" width="70" height="50" rx="8" fill="#0d1f2d" stroke="#10b981" stroke-width="2" />
    <circle cx="0" cy="0" r="10" fill="#10b981" />
    <text x="0" y="3" fill="#052e16" font-family="monospace" font-size="8" text-anchor="middle" font-weight="900">UAV</text>
  </g>

  <!-- Engineer Silhouette Avatar -->
  <g transform="translate(200, 260)">
    <!-- Shoulders -->
    <path d="M -80 120 C -80 70, -50 45, 0 45 C 50 45, 80 70, 80 120 Z" fill="#0e1726" stroke="#10b981" stroke-width="1.5" />
    <!-- Tie / Collar -->
    <path d="M -15 45 L 0 85 L 15 45 Z" fill="#10b981" opacity="0.3" />
    <!-- Head -->
    <circle cx="0" cy="5" r="38" fill="#132238" stroke="#38bdf8" stroke-width="2" />
    <!-- Beard / Hair style hint -->
    <path d="M -30 -5 C -30 -40, 30 -40, 30 -5 C 28 25, -28 25, -30 -5 Z" fill="#1e293b" />
    <!-- Glasses / Tech Visor -->
    <rect x="-24" y="-3" width="20" height="10" rx="3" fill="#06b6d4" opacity="0.85" />
    <rect x="4" y="-3" width="20" height="10" rx="3" fill="#06b6d4" opacity="0.85" />
    <line x1="-4" y1="2" x2="4" y2="2" stroke="#06b6d4" stroke-width="2" />
  </g>

  <!-- Overlay Telemetry Text -->
  <text x="35" y="380" fill="#94a3b8" font-family="monospace" font-size="10">SYS: ARDUPILOT · VTOL</text>
  <text x="365" y="380" fill="#34d399" font-family="monospace" font-size="10" text-anchor="end">AUTONOMY: ARMED</text>
</svg>